<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
  <defs>
    <style>
      text { font-family: 'Courier New', monospace; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="2000" height="1200" fill="#0b0f14"/>

  <!-- Plan extent frame — marks where the plan image ends, since the
       background is otherwise indistinguishable from the page around it -->
  <rect x="4" y="4" width="1992" height="1192" fill="none" stroke="#cfd8e3" stroke-width="8"/>
  <g stroke="#f2f5f8" stroke-width="10">
    <line x1="4" y1="4" x2="60" y2="4"/>
    <line x1="4" y1="4" x2="4" y2="60"/>
    <line x1="1996" y1="4" x2="1940" y2="4"/>
    <line x1="1996" y1="4" x2="1996" y2="60"/>
    <line x1="4" y1="1196" x2="60" y2="1196"/>
    <line x1="4" y1="1196" x2="4" y2="1140"/>
    <line x1="1996" y1="1196" x2="1940" y2="1196"/>
    <line x1="1996" y1="1196" x2="1996" y2="1140"/>
  </g>

  <!-- Drive A (north) bore -->
  <rect x="150" y="270" width="1700" height="60" fill="#141b22"/>
  <!-- Drive B (south) bore -->
  <rect x="150" y="790" width="1700" height="60" fill="#141b22"/>

  <!-- Crosscut bores -->
  <rect x="530" y="330" width="40" height="460" fill="#141b22"/>
  <rect x="1030" y="330" width="40" height="460" fill="#141b22"/>
  <rect x="1530" y="330" width="40" height="460" fill="#141b22"/>

  <!-- Drive A walls -->
  <line x1="150" y1="270" x2="1850" y2="270" stroke="#cfd8e3" stroke-width="4"/>
  <line x1="150" y1="330" x2="1850" y2="330" stroke="#cfd8e3" stroke-width="4"/>
  <line x1="150" y1="270" x2="150" y2="330" stroke="#cfd8e3" stroke-width="4"/>
  <line x1="1850" y1="270" x2="1850" y2="330" stroke="#cfd8e3" stroke-width="4"/>

  <!-- Drive B walls -->
  <line x1="150" y1="790" x2="1850" y2="790" stroke="#cfd8e3" stroke-width="4"/>
  <line x1="150" y1="850" x2="1850" y2="850" stroke="#cfd8e3" stroke-width="4"/>
  <line x1="150" y1="790" x2="150" y2="850" stroke="#cfd8e3" stroke-width="4"/>
  <line x1="1850" y1="790" x2="1850" y2="850" stroke="#cfd8e3" stroke-width="4"/>

  <!-- Crosscut walls -->
  <line x1="530" y1="330" x2="530" y2="790" stroke="#cfd8e3" stroke-width="4"/>
  <line x1="570" y1="330" x2="570" y2="790" stroke="#cfd8e3" stroke-width="4"/>
  <line x1="1030" y1="330" x2="1030" y2="790" stroke="#cfd8e3" stroke-width="4"/>
  <line x1="1070" y1="330" x2="1070" y2="790" stroke="#cfd8e3" stroke-width="4"/>
  <line x1="1530" y1="330" x2="1530" y2="790" stroke="#cfd8e3" stroke-width="4"/>
  <line x1="1570" y1="330" x2="1570" y2="790" stroke="#cfd8e3" stroke-width="4"/>

  <!-- Drive labels -->
  <text x="170" y="255" font-size="26" fill="#8fa3b8">DRIVE A (NORTH)</text>
  <text x="170" y="885" font-size="26" fill="#8fa3b8">DRIVE B (SOUTH)</text>

  <!-- Crosscut labels -->
  <text x="550" y="565" font-size="22" fill="#8fa3b8" text-anchor="middle" transform="rotate(-90 550 565)">XC-1</text>
  <text x="1050" y="565" font-size="22" fill="#8fa3b8" text-anchor="middle" transform="rotate(-90 1050 565)">XC-2</text>
  <text x="1550" y="565" font-size="22" fill="#8fa3b8" text-anchor="middle" transform="rotate(-90 1550 565)">XC-3</text>

  <!-- Compressed air line along Drive A, with pipe section ticks PS-01..PS-08 -->
  <line x1="150" y1="316" x2="1850" y2="316" stroke="#e8a33d" stroke-width="5"/>

  <g stroke="#e8a33d" stroke-width="3">
    <line x1="200" y1="308" x2="200" y2="324"/>
    <line x1="430" y1="308" x2="430" y2="324"/>
    <line x1="660" y1="308" x2="660" y2="324"/>
    <line x1="890" y1="308" x2="890" y2="324"/>
    <line x1="1120" y1="308" x2="1120" y2="324"/>
    <line x1="1350" y1="308" x2="1350" y2="324"/>
    <line x1="1580" y1="308" x2="1580" y2="324"/>
    <line x1="1800" y1="308" x2="1800" y2="324"/>
  </g>

  <g font-size="18" fill="#e8a33d" text-anchor="middle">
    <text x="200" y="352">PS-01</text>
    <text x="430" y="352">PS-02</text>
    <text x="660" y="352">PS-03</text>
    <text x="890" y="352">PS-04</text>
    <text x="1120" y="352">PS-05</text>
    <text x="1350" y="352">PS-06</text>
    <text x="1580" y="352">PS-07</text>
    <text x="1800" y="352">PS-08</text>
  </g>

  <!-- Legend -->
  <rect x="1700" y="55" width="40" height="10" fill="#e8a33d"/>
  <text x="1750" y="65" font-size="20" fill="#8fa3b8">COMPRESSED AIR LINE</text>

  <!-- Survey pegs -->
  <g stroke="#f2f5f8" stroke-width="3" fill="none">
    <circle cx="150" cy="190" r="14"/>
    <line x1="130" y1="190" x2="170" y2="190"/>
    <line x1="150" y1="170" x2="150" y2="210"/>
  </g>
  <text x="175" y="197" font-size="24" fill="#f2f5f8">SP-14</text>

  <g stroke="#f2f5f8" stroke-width="3" fill="none">
    <circle cx="1850" cy="930" r="14"/>
    <line x1="1830" y1="930" x2="1870" y2="930"/>
    <line x1="1850" y1="910" x2="1850" y2="950"/>
  </g>
  <text x="1690" y="937" font-size="24" fill="#f2f5f8">SP-22</text>

  <!-- Title -->
  <text x="60" y="1150" font-size="28" fill="#8fa3b8">24 LEVEL &#8212; SCHEMATIC PLACEHOLDER</text>
</svg>
